<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 编程教育智能体系统</title>
  <style>
    :root {
      --bg: linear-gradient(180deg, #f6fbf8, #edf4f7);
      --panel: rgba(255, 255, 255, 0.96);
      --line: #d8e3e2;
      --ink: #17232f;
      --muted: #657789;
      --accent: #0f766e;
      --accent-2: #2563eb;
      --warn: #b7791f;
      --ok: #1f8f4c;
      --soft: #f4f8f7;
      --shadow: 0 22px 54px rgba(20, 36, 52, 0.11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.09), transparent 30%),
        var(--bg);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .layout {
      width: min(1220px, 100%);
      margin: 0 auto;
      padding: 22px;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(216, 227, 226, 0.95);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .sidebar {
      padding: 22px;
      display: grid;
      gap: 16px;
      align-content: start;
      min-height: calc(100vh - 44px);
    }

    .main {
      padding: 22px;
      display: grid;
      gap: 16px;
      min-height: calc(100vh - 44px);
    }

    h1, h2, h3 {
      margin: 0;
    }

    .title {
      font-size: 26px;
      line-height: 1.25;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 11px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #13a092);
    }

    .secondary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent-2), #3b82f6);
    }

    .ghost {
      background: #eef7f6;
      color: var(--ink);
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 32px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #d9f7ef, #dbeafe);
      color: var(--accent);
      font-size: 42px;
      font-weight: 900;
      border: 1px solid var(--line);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-form {
      display: grid;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #344657;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 86px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      padding: 16px;
    }

    .stat {
      display: grid;
      gap: 6px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 900;
      color: var(--accent);
    }

    .level-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.10), rgba(37, 99, 235, 0.08)),
        #fff;
    }

    .level-name {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .level-score {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--accent) var(--progress, 10%), #e7f0ef 0);
      position: relative;
      font-size: 28px;
      font-weight: 900;
      color: var(--accent);
    }

    .level-score::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: white;
    }

    .level-score span {
      position: relative;
    }

    .progress-list,
    .recommend-list,
    .recent-list {
      display: grid;
      gap: 10px;
    }

    .row {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      background: #fbfefd;
      display: grid;
      gap: 8px;
    }

    .row-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .row-title {
      font-weight: 850;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 800;
      background: #edf7f6;
      color: var(--accent);
      white-space: nowrap;
    }

    .pill.warn {
      background: #fff7df;
      color: var(--warn);
    }

    .pill.ok {
      background: #ecfdf3;
      color: var(--ok);
    }

    .bar {
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: #e8f0f0;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      width: var(--width, 0%);
    }

    .message {
      min-height: 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar,
      .main {
        min-height: auto;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="card sidebar">
      <div>
        <h1 class="title">个人中心</h1>
        <div class="meta" id="userMeta">正在加载用户信息...</div>
      </div>

      <div class="avatar" id="avatarPreview">U</div>

      <form class="profile-form" id="profileForm">
        <label>
          昵称
          <input id="nicknameInput" maxlength="32" placeholder="给自己起一个学习昵称">
        </label>
        <label>
          头像地址
          <input id="avatarInput" maxlength="500" placeholder="可粘贴图片 URL，留空使用默认头像">
        </label>
        <label>
          个人简介
          <textarea id="bioInput" maxlength="160" placeholder="比如：正在学习 Python 基础"></textarea>
        </label>
        <button class="primary" type="submit">保存资料</button>
        <div class="message" id="profileMessage"></div>
      </form>

      <div class="toolbar">
        <button class="ghost" id="goLearnBtn" type="button">学习中心</button>
        <button class="ghost" id="goQuestionsBtn" type="button">题库大全</button>
        <button class="ghost" id="goChatBtn" type="button">对话页</button>
      </div>
      <button class="ghost" id="logoutBtn" type="button">退出登录</button>
    </aside>

    <main class="card main">
      <section class="panel level-card">
        <div>
          <div class="meta">当前学习水平</div>
          <div class="level-name" id="levelName">正在分析...</div>
          <div class="meta" id="levelDesc">系统会根据你的学习进度、做题次数和通过情况生成判断。</div>
        </div>
        <div class="level-score" id="levelScore" style="--progress: 10%">
          <span>10</span>
        </div>
      </section>

      <section class="grid">
        <div class="panel stat">
          <div class="meta">完成知识点</div>
          <div class="stat-value" id="completedStat">0/0</div>
        </div>
        <div class="panel stat">
          <div class="meta">练习提交</div>
          <div class="stat-value" id="attemptStat">0</div>
        </div>
        <div class="panel stat">
          <div class="meta">平均最好得分</div>
          <div class="stat-value" id="scoreStat">0</div>
        </div>
      </section>

      <section class="panel">
        <h2>智能推荐</h2>
        <div class="meta">根据你的完成情况、得分和未通过记录，推荐下一步学习内容。</div>
        <div class="recommend-list" id="recommendList"></div>
      </section>

      <section class="panel">
        <h2>学习进度</h2>
        <div class="progress-list" id="progressList"></div>
      </section>

      <section class="panel">
        <h2>最近练习</h2>
        <div class="recent-list" id="recentList"></div>
      </section>
    </main>
  </div>

  <script>
    const userMeta = document.getElementById("userMeta");
    const avatarPreview = document.getElementById("avatarPreview");
    const profileForm = document.getElementById("profileForm");
    const nicknameInput = document.getElementById("nicknameInput");
    const avatarInput = document.getElementById("avatarInput");
    const bioInput = document.getElementById("bioInput");
    const profileMessage = document.getElementById("profileMessage");
    const goLearnBtn = document.getElementById("goLearnBtn");
    const goQuestionsBtn = document.getElementById("goQuestionsBtn");
    const goChatBtn = document.getElementById("goChatBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const levelName = document.getElementById("levelName");
    const levelDesc = document.getElementById("levelDesc");
    const levelScore = document.getElementById("levelScore");
    const completedStat = document.getElementById("completedStat");
    const attemptStat = document.getElementById("attemptStat");
    const scoreStat = document.getElementById("scoreStat");
    const recommendList = document.getElementById("recommendList");
    const progressList = document.getElementById("progressList");
    const recentList = document.getElementById("recentList");

    let accessToken = localStorage.getItem("pes_token");
    let refreshToken = localStorage.getItem("pes_refresh_token");

    if (!accessToken || !refreshToken) {
      window.location.href = "/";
    }

    const escapeHTML = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const saveAuth = (data) => {
      accessToken = data.access_token;
      refreshToken = data.refresh_token;
      localStorage.setItem("pes_token", data.access_token);
      localStorage.setItem("pes_refresh_token", data.refresh_token);
      localStorage.setItem("pes_username", data.username);
      localStorage.setItem("pes_expires_at", data.expires_at);
      localStorage.setItem("pes_refresh_expires_at", data.refresh_expires_at);
    };

    const clearAuth = () => {
      localStorage.removeItem("pes_token");
      localStorage.removeItem("pes_refresh_token");
      localStorage.removeItem("pes_username");
      localStorage.removeItem("pes_expires_at");
      localStorage.removeItem("pes_refresh_expires_at");
    };

    const refreshAuth = async () => {
      const response = await fetch("/auth/refresh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "登录已过期");
      saveAuth(data);
      return data;
    };

    const authedFetch = async (url, options = {}, retry = true) => {
      const headers = {
        ...(options.headers || {}),
        Authorization: `Bearer ${accessToken}`
      };
      const response = await fetch(url, { ...options, headers });
      if (response.status === 401 && retry) {
        await refreshAuth();
        return authedFetch(url, options, false);
      }
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "请求失败");
      return data;
    };

    const formatTime = (value) => {
      if (!value) return "暂无";
      return new Date(value).toLocaleString("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    };

    const renderAvatar = (profile) => {
      const nickname = profile.nickname || profile.username || "U";
      if (profile.avatar_url) {
        avatarPreview.innerHTML = `<img src="${escapeHTML(profile.avatar_url)}" alt="头像">`;
      } else {
        avatarPreview.textContent = nickname.slice(0, 1).toUpperCase();
      }
    };

    const renderOverview = (data) => {
      const profile = data.profile || {};
      nicknameInput.value = profile.nickname || profile.username || "";
      avatarInput.value = profile.avatar_url || "";
      bioInput.value = profile.bio || "";
      userMeta.textContent = `账号：${profile.username || ""}`;
      renderAvatar(profile);

      levelName.textContent = data.level.name;
      levelDesc.textContent = data.level.description;
      levelScore.style.setProperty("--progress", `${data.level.score}%`);
      levelScore.querySelector("span").textContent = data.level.score;

      completedStat.textContent = `${data.stats.completed_lessons}/${data.stats.total_lessons}`;
      attemptStat.textContent = data.stats.total_attempts;
      scoreStat.textContent = data.stats.average_best_score;

      recommendList.innerHTML = (data.recommendations || []).map(item => `
        <div class="row">
          <div class="row-head">
            <div class="row-title">${escapeHTML(item.title)}</div>
            <span class="pill ${item.priority === "high" ? "warn" : ""}">${escapeHTML(item.action)}</span>
          </div>
          <div class="meta">${escapeHTML(item.reason)}</div>
        </div>
      `).join("") || '<div class="meta">暂无推荐。</div>';

      progressList.innerHTML = (data.lesson_progress || []).map(item => {
        const statusText = item.status === "completed" ? "已完成" : item.status === "in_progress" ? "进行中" : "未开始";
        const pillClass = item.status === "completed" ? "ok" : item.status === "in_progress" ? "warn" : "";
        const width = Math.max(0, Math.min(100, item.best_score || 0));
        return `
          <div class="row">
            <div class="row-head">
              <div class="row-title">${escapeHTML(item.title)}</div>
              <span class="pill ${pillClass}">${statusText}</span>
            </div>
            <div class="bar"><span style="--width: ${width}%"></span></div>
            <div class="meta">尝试 ${item.attempts} 次，最好得分 ${item.best_score}，最近提交：${formatTime(item.last_submitted_at)}</div>
          </div>
        `;
      }).join("") || '<div class="meta">还没有学习进度。</div>';

      recentList.innerHTML = (data.recent_submissions || []).map(item => `
        <div class="row">
          <div class="row-head">
            <div class="row-title">${escapeHTML(item.lesson_title)}</div>
            <span class="pill ${item.passed ? "ok" : "warn"}">${item.passed ? "通过" : "未通过"}</span>
          </div>
          <div class="meta">得分 ${item.score}，提交时间：${formatTime(item.submitted_at)}</div>
        </div>
      `).join("") || '<div class="meta">还没有练习提交记录。</div>';
    };

    const loadOverview = async () => {
      const data = await authedFetch("/profile/overview");
      renderOverview(data);
    };

    profileForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      profileMessage.textContent = "正在保存...";
      try {
        await authedFetch("/profile", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nickname: nicknameInput.value,
            avatar_url: avatarInput.value,
            bio: bioInput.value
          })
        });
        profileMessage.textContent = "资料已保存。";
        await loadOverview();
      } catch (error) {
        profileMessage.textContent = `保存失败：${error.message}`;
      }
    });

    goLearnBtn.addEventListener("click", () => { window.location.href = "/learn"; });
    goQuestionsBtn.addEventListener("click", () => { window.location.href = "/questions"; });
    goChatBtn.addEventListener("click", () => { window.location.href = "/chat"; });
    logoutBtn.addEventListener("click", async () => {
      try {
        await authedFetch("/auth/logout", { method: "POST" });
      } catch (_) {
      } finally {
        clearAuth();
        window.location.href = "/";
      }
    });

    loadOverview().catch(() => {
      clearAuth();
      window.location.href = "/";
    });
  </script>
</body>
</html>
