<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编程教育智能体系统 - 登录</title>
  <style>
    :root {
      --bg: linear-gradient(135deg, #f4efe7, #dce8f2);
      --panel: rgba(255, 255, 255, 0.92);
      --ink: #1d2a35;
      --muted: #576574;
      --accent: #1b6ca8;
      --accent-2: #2f855a;
      --danger: #b83232;
      --border: rgba(27, 108, 168, 0.15);
      --shadow: 0 24px 60px rgba(24, 44, 69, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      background: var(--panel);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .hero {
      padding: 48px;
      background:
        radial-gradient(circle at top left, rgba(27, 108, 168, 0.18), transparent 40%),
        radial-gradient(circle at bottom right, rgba(47, 133, 90, 0.18), transparent 35%);
    }

    .hero h1 {
      margin: 0 0 16px;
      font-size: clamp(32px, 4vw, 44px);
      line-height: 1.1;
    }

    .hero p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    .hero ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.9;
    }

    .panel {
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #eef5fb;
      border-radius: 14px;
      padding: 6px;
    }

    .tabs button {
      border: 0;
      padding: 12px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
    }

    .tabs button.active {
      background: white;
      color: var(--accent);
      box-shadow: 0 6px 16px rgba(27, 108, 168, 0.12);
    }

    .form {
      display: none;
      gap: 12px;
    }

    .form.active {
      display: grid;
    }

    label {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }

    input {
      width: 100%;
      border: 1px solid #d8e2ec;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(27, 108, 168, 0.12);
    }

    .submit {
      border: 0;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #2b8ac6);
    }

    .submit.secondary {
      background: linear-gradient(135deg, var(--accent-2), #38a169);
    }

    .status {
      min-height: 22px;
      font-size: 14px;
      color: var(--muted);
    }

    .status.error { color: var(--danger); }
    .status.success { color: var(--accent-2); }

    @media (max-width: 800px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 32px 28px 12px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>登录后进入多智能体编程学习系统</h1>
      <p>这是一个最简可用版入口。注册账号后，你就可以直接在浏览器里访问问答、练习生成、代码评估和学习建议能力。</p>
      <ul>
        <li>支持注册与登录</li>
        <li>登录状态基于 Bearer Token</li>
        <li>登录成功后自动进入对话页面</li>
      </ul>
    </section>

    <section class="panel">
      <div class="tabs">
        <button id="loginTab" class="active" type="button">登录</button>
        <button id="registerTab" type="button">注册</button>
      </div>

      <form id="loginForm" class="form active">
        <div>
          <label for="loginUsername">用户名</label>
          <input id="loginUsername" name="username" autocomplete="username" placeholder="请输入用户名">
        </div>
        <div>
          <label for="loginPassword">密码</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>
        <button class="submit" type="submit">登录并进入系统</button>
      </form>

      <form id="registerForm" class="form">
        <div>
          <label for="registerUsername">用户名</label>
          <input id="registerUsername" name="username" autocomplete="username" placeholder="3-32 位字母数字下划线">
        </div>
        <div>
          <label for="registerPassword">密码</label>
          <input id="registerPassword" name="password" type="password" autocomplete="new-password" placeholder="至少 6 位">
        </div>
        <button class="submit secondary" type="submit">注册并自动登录</button>
      </form>

      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const setMode = (mode) => {
      const loginMode = mode === "login";
      loginTab.classList.toggle("active", loginMode);
      registerTab.classList.toggle("active", !loginMode);
      loginForm.classList.toggle("active", loginMode);
      registerForm.classList.toggle("active", !loginMode);
      statusEl.textContent = "";
      statusEl.className = "status";
    };

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    const saveAuth = (data) => {
      localStorage.setItem("pes_token", data.access_token);
      localStorage.setItem("pes_refresh_token", data.refresh_token);
      localStorage.setItem("pes_username", data.username);
      localStorage.setItem("pes_expires_at", data.expires_at);
      localStorage.setItem("pes_refresh_expires_at", data.refresh_expires_at);
    };

    const showStatus = (message, type = "") => {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    };

    const submitJson = async (url, payload) => {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.detail || "请求失败");
      }
      return data;
    };

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        showStatus("正在登录...");
        const data = await submitJson("/auth/login", {
          username: loginForm.username.value.trim(),
          password: loginForm.password.value
        });
        saveAuth(data);
        showStatus("登录成功，正在进入系统...", "success");
        window.location.href = "/chat";
      } catch (error) {
        showStatus(error.message, "error");
      }
    });

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        showStatus("正在注册...");
        const payload = {
          username: registerForm.username.value.trim(),
          password: registerForm.password.value
        };
        await submitJson("/auth/register", payload);
        const loginData = await submitJson("/auth/login", payload);
        saveAuth(loginData);
        showStatus("注册成功，正在进入系统...", "success");
        window.location.href = "/chat";
      } catch (error) {
        showStatus(error.message, "error");
      }
    });

    if (localStorage.getItem("pes_token") && localStorage.getItem("pes_refresh_token")) {
      window.location.href = "/chat";
    }
  </script>
</body>
</html>
