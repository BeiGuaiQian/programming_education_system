<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题目详情 - CodeMentor</title>
  <link rel="stylesheet" href="/static/edu_ide.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      background: #f9f8f6;
      color: #3a3a3a;
      min-height: 100vh;
    }

    /* ========== 顶部导航栏 ========== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e2dd;
      box-shadow: 0px 1px 3px rgba(0,0,0,0.04), 0px 1px 2px rgba(0,0,0,0.02);
      background: #ffffff;
      padding: 0 32px;
      height: 65px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      column-gap: 12px;
    }

    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #6b9ab8;
      width: 36px;
      height: 36px;
      color: #fff;
      font-size: 18px;
    }

    .logo-text {
      line-height: 24px;
      color: #3a3a3a;
      font-size: 16px;
      font-weight: 500;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      column-gap: 8px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      column-gap: 6px;
      border-radius: 8px;
      padding: 8px 16px;
      height: 36px;
      border: none;
      background: transparent;
      color: #8a8a8a;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: #f9f8f6;
      color: #3a3a3a;
    }

    .nav-btn.active {
      background: #e8f1f8;
      color: #7aa8c7;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #5b8aaf, #4a5568);
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .logout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: #8a8a8a;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      background: #f9f8f6;
      color: #c53030;
    }

    /* ========== 主体布局 ========== */
    .question-page {
      padding: 24px 32px;
      max-width: 1400px;
      margin: 0 auto;
      min-height: calc(100vh - 65px);
      display: grid;
      grid-template-columns: minmax(360px, 0.95fr) minmax(460px, 1.05fr);
      gap: 24px;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #e5e2dd;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      overflow: hidden;
      min-height: 0;
    }

    .pane-body {
      padding: 24px;
      overflow: auto;
      height: 100%;
    }

    h1, h2, h3 {
      margin: 0;
    }

    .title {
      font-size: 24px;
      font-weight: 500;
      color: #3a3a3a;
      margin-bottom: 12px;
    }

    .meta {
      color: #8a8a8a;
      font-size: 14px;
      line-height: 1.75;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background: #f0f8f5;
      color: #7a9b87;
    }

    .content {
      line-height: 1.85;
      white-space: pre-wrap;
      color: #3a3a3a;
    }

    .example-box,
    .hint-box,
    .result-box {
      border: 1px solid #e5e2dd;
      border-radius: 10px;
      background: #f9f8f6;
      padding: 16px;
      margin-top: 16px;
    }

    .result-box.ok {
      background: #ecfdf3;
      color: #1f8f4c;
      border-color: #b7ebc5;
    }

    .result-box.bad {
      background: #fff5f5;
      color: #c53030;
      border-color: #fed7d7;
    }

    .editor-shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #0b1220;
    }

    .editor-head,
    .editor-actions {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: #0b1220;
      color: #dbe7f5;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .editor-actions {
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      border-bottom: 0;
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 360px;
      border: 0;
      outline: none;
      resize: none;
      padding: 16px;
      background: #0f172a;
      color: #e5edf9;
      font: 14px/1.65 Consolas, "Courier New", monospace;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #e5e2dd;
      padding: 10px;
      text-align: left;
      word-break: break-word;
      vertical-align: top;
    }

    th {
      background: #f9f8f6;
      font-weight: 500;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    .primary {
      color: white;
      background: #7a9b87;
    }

    .secondary {
      color: white;
      background: #6b9ab8;
    }

    .ghost {
      color: #3a3a3a;
      background: #f0f0f0;
    }

    /* 响应式 */
    @media (max-width: 980px) {
      .question-page {
        grid-template-columns: 1fr;
        height: auto;
      }
      .panel {
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-icon">&lt;/&gt;</div>
      <span class="logo-text">CodeMentor</span>
    </div>
    <nav class="topbar-nav">
      <a href="/learn" class="nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
        学习中心
      </a>
      <a href="/questions" class="nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        题库
      </a>
      <a href="/chat" class="nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        AI 助手
      </a>
      <a href="/profile" class="nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        个人中心
      </a>
    </nav>
    <div class="topbar-user">
      <div class="user-avatar" id="userAvatar">U</div>
      <button class="logout-btn" id="logoutBtn" type="button">退出</button>
    </div>
  </header>

  <!-- 主体 -->
  <main class="question-page">
    <section class="panel">
      <div class="pane-body">
        <h1 class="title" id="questionTitle">正在加载题目...</h1>
        <div class="meta" id="questionMeta"></div>
        <div class="pill-row" id="tagList"></div>
        <section>
          <h2 style="font-size: 18px; font-weight: 500; margin-bottom: 10px;">题目描述</h2>
          <div class="content" id="questionContent"></div>
        </section>
        <section class="example-box">
          <h3 style="font-size: 16px; font-weight: 500; margin-bottom: 10px;">示例</h3>
          <div id="exampleList" class="meta"></div>
        </section>
        <section class="hint-box">
          <h3 style="font-size: 16px; font-weight: 500; margin-bottom: 10px;">提示</h3>
          <div id="hintList" class="meta"></div>
        </section>
        <section class="result-box" id="resultBox">提交后，这里会显示判题结果。</section>
        <div id="testTableWrap"></div>
      </div>
    </section>

    <section class="panel">
      <div class="editor-shell">
        <div class="editor-head">
          <strong>Python IDE</strong>
          <span id="editorStatus">Ctrl/Cmd + Enter 提交</span>
        </div>
        <textarea id="codeEditor" spellcheck="false"></textarea>
        <div class="editor-actions">
          <div>
            <button class="ghost" id="starterBtn" type="button">恢复模板</button>
            <button class="ghost" id="lastBtn" type="button">恢复上次</button>
            <button class="ghost" id="answerBtn" type="button">查看参考答案</button>
          </div>
          <button class="primary" id="submitBtn" type="button">提交判题</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="/static/edu_ide.js"></script>
  <script>
    const userAvatar = document.getElementById("userAvatar");
    const questionTitle = document.getElementById("questionTitle");
    const questionMeta = document.getElementById("questionMeta");
    const tagList = document.getElementById("tagList");
    const questionContent = document.getElementById("questionContent");
    const exampleList = document.getElementById("exampleList");
    const hintList = document.getElementById("hintList");
    const resultBox = document.getElementById("resultBox");
    const testTableWrap = document.getElementById("testTableWrap");
    const codeEditor = document.getElementById("codeEditor");
    const editorStatus = document.getElementById("editorStatus");
    const submitBtn = document.getElementById("submitBtn");
    const starterBtn = document.getElementById("starterBtn");
    const lastBtn = document.getElementById("lastBtn");
    const answerBtn = document.getElementById("answerBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    let accessToken = localStorage.getItem("pes_token");
    let refreshToken = localStorage.getItem("pes_refresh_token");
    let question = null;
    let latestCode = "";
    let questionEnteredAt = Date.now();
    let eduIDE = null;

    if (!accessToken || !refreshToken) {
      window.location.href = "/";
    }

    const questionId = decodeURIComponent(window.location.pathname.split("/").filter(Boolean).pop());

    const escapeHTML = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const saveAuth = (data) => {
      accessToken = data.access_token;
      refreshToken = data.refresh_token;
      localStorage.setItem("pes_token", data.access_token);
      localStorage.setItem("pes_refresh_token", data.refresh_token);
      localStorage.setItem("pes_username", data.username);
    };

    const clearAuth = () => {
      localStorage.removeItem("pes_token");
      localStorage.removeItem("pes_refresh_token");
      localStorage.removeItem("pes_username");
    };

    const refreshAuth = async () => {
      const response = await fetch("/auth/refresh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "登录已过期");
      saveAuth(data);
      return data;
    };

    const authedFetch = async (url, options = {}, retry = true) => {
      const headers = {
        ...(options.headers || {}),
        Authorization: `Bearer ${accessToken}`
      };
      const response = await fetch(url, { ...options, headers });
      if (response.status === 401 && retry) {
        await refreshAuth();
        return authedFetch(url, options, false);
      }
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "请求失败");
      return data;
    };

    const trackLearningEvent = (eventType, targetType, targetId, durationSeconds = null, metadata = {}) => {
      if (!accessToken) return;
      fetch("/analytics/events", {
        method: "POST",
        keepalive: true,
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${accessToken}`
        },
        body: JSON.stringify({
          event_type: eventType,
          target_type: targetType,
          target_id: targetId,
          duration_seconds: durationSeconds,
          metadata
        })
      }).catch(() => {});
    };

    const flushQuestionDwell = () => {
      if (!question) return;
      const durationSeconds = Math.round((Date.now() - questionEnteredAt) / 1000);
      if (durationSeconds < 3) return;
      trackLearningEvent("question_dwell", "question", question.id, durationSeconds, {
        title: question.title,
        page: "question_detail"
      });
      questionEnteredAt = Date.now();
    };

    const updateEditorStatus = () => {
      const value = getEditorCode();
      const lines = value.split("\n").length;
      editorStatus.textContent = `${lines} 行 / ${value.length} 字符，Ctrl/Cmd + Enter 提交`;
    };

    const getEditorCode = () => eduIDE ? eduIDE.getValue() : codeEditor.value;
    const setEditorCode = (value) => {
      if (eduIDE) eduIDE.setValue(value || "");
      else codeEditor.value = value || "";
      updateEditorStatus();
    };
    const focusEditor = () => {
      if (eduIDE) eduIDE.focus();
      else codeEditor.focus();
    };

    const renderTests = (tests) => {
      if (!tests || !tests.length) {
        testTableWrap.innerHTML = "";
        return;
      }
      testTableWrap.innerHTML = `
        <table>
          <thead><tr><th>调用</th><th>期望</th><th>实际</th><th>结果</th></tr></thead>
          <tbody>
            ${tests.map(item => `
              <tr>
                <td>${escapeHTML(item.call)}</td>
                <td>${escapeHTML(JSON.stringify(item.expected))}</td>
                <td>${escapeHTML(JSON.stringify(item.actual))}</td>
                <td>${item.passed ? "通过" : "未通过"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    };

    const renderResult = (payload) => {
      resultBox.className = `result-box ${payload.passed ? "ok" : "bad"}`;
      resultBox.textContent = `判题结果：${payload.passed ? "通过" : "未通过"}\n得分：${payload.score}\n\n${payload.feedback || ""}`;
      renderTests((payload.test_result || {}).test_results || []);
      if (eduIDE) {
        eduIDE.markSubmitResult(payload.passed);
        eduIDE.renderSubmitFeedback(payload.ide_feedback);
      }
    };

    const renderQuestion = (payload) => {
      question = payload.question;
      questionEnteredAt = Date.now();
      questionTitle.textContent = question.title;
      questionMeta.textContent = `${question.topic_name} · ${question.difficulty} · ${question.type} · 预计 ${question.estimated_minutes} 分钟`;
      tagList.innerHTML = (question.tags || []).map(tag => `<span class="pill">${escapeHTML(tag)}</span>`).join("");
      questionContent.textContent = question.content;
      exampleList.innerHTML = (question.examples || []).map(item => `输入：${escapeHTML(item.input)}<br>输出：${escapeHTML(item.output)}`).join("<hr>");
      hintList.innerHTML = (question.hints || []).map(hint => `- ${escapeHTML(hint)}`).join("<br>");
      latestCode = (payload.latest_submission && payload.latest_submission.code) || "";
      setEditorCode(latestCode || question.starter_code || "");
      updateEditorStatus();
      if (payload.latest_submission) {
        renderResult({
          passed: payload.latest_submission.passed,
          score: payload.latest_submission.score,
          feedback: payload.latest_submission.feedback,
          test_result: payload.latest_submission.test_result
        });
      }
      trackLearningEvent("question_open", "question", question.id, null, {
        title: question.title,
        topic: question.topic,
        difficulty: question.difficulty
      });
    };

    const submitCode = async () => {
      if (!question) return;
      submitBtn.disabled = true;
      submitBtn.textContent = "判题中...";
      resultBox.className = "result-box";
      resultBox.textContent = "正在运行隐藏测试，请稍候...";
      testTableWrap.innerHTML = "";
      try {
        const payload = await authedFetch(`/question-bank/questions/${question.id}/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: getEditorCode() })
        });
        latestCode = getEditorCode();
        renderResult(payload);
        trackLearningEvent("question_submit_client", "question", question.id, null, {
          passed: payload.passed,
          score: payload.score
        });
      } catch (error) {
        resultBox.className = "result-box bad";
        resultBox.textContent = `提交失败：${error.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "提交判题";
      }
    };

    codeEditor.addEventListener("input", updateEditorStatus);
    codeEditor.addEventListener("keydown", (event) => {
      if (event.key === "Tab") {
        event.preventDefault();
        const start = codeEditor.selectionStart;
        const end = codeEditor.selectionEnd;
        codeEditor.value = `${codeEditor.value.slice(0, start)}    ${codeEditor.value.slice(end)}`;
        codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
        updateEditorStatus();
      }
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        submitCode();
      }
    });

    submitBtn.addEventListener("click", submitCode);
    starterBtn.addEventListener("click", () => {
      setEditorCode(question ? question.starter_code || "" : "");
      updateEditorStatus();
      focusEditor();
    });
    lastBtn.addEventListener("click", () => {
      setEditorCode(latestCode || (question ? question.starter_code || "" : ""));
      updateEditorStatus();
      focusEditor();
    });
    answerBtn.addEventListener("click", () => {
      if (!question) return;
      setEditorCode(question.answer || "");
      updateEditorStatus();
      focusEditor();
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await authedFetch("/auth/logout", { method: "POST" });
      } catch (_) {
      } finally {
        clearAuth();
        window.location.href = "/";
      }
    });

    const bootstrap = async () => {
      try {
        const me = await authedFetch("/auth/me");
        userAvatar.textContent = me.username.charAt(0).toUpperCase();
      } catch (_) {}
    };

    createEduIDE({
      textarea: codeEditor,
      statusEl: editorStatus,
      apiFetch: authedFetch,
      contextTypeGetter: () => "question",
      targetIdGetter: () => question ? question.id : questionId,
      expectedFunctionGetter: () => question ? question.expected_function || "" : "",
      requirementsGetter: () => question ? question.hints || [] : [],
      onSubmit: submitCode,
      onChange: updateEditorStatus
    }).then(instance => {
      eduIDE = instance;
      if (codeEditor.value) eduIDE.setValue(codeEditor.value);
    });

    authedFetch(`/question-bank/questions/${questionId}`)
      .then(renderQuestion)
      .catch(() => {
        clearAuth();
        window.location.href = "/";
      });

    bootstrap();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        flushQuestionDwell();
      } else {
        questionEnteredAt = Date.now();
      }
    });
    window.addEventListener("beforeunload", flushQuestionDwell);
  </script>
</body>
</html>
